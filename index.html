<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win the Secret Prize</title>
<style>
  :root { --bg:#14213d; --sky:#1d3461; --gold:#fcbf49; --cream:#fdf0d5; --coral:#ef476f; --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(var(--bg),var(--sky)); color:var(--cream); font-family:var(--font); display:flex; flex-direction:column; align-items:center; padding:16px; touch-action:manipulation; }
  main { width:100%; max-width:420px; text-align:center; }
  h1 { margin:4px 0 12px; font-size:1.5rem; }
  h2 { margin:8px 0; }
  p { line-height:1.5; margin:8px 0; }
  #slots { display:flex; gap:10px; justify-content:center; margin-bottom:16px; }
  .slot { width:56px; height:56px; border:2px dashed var(--gold); border-radius:12px; display:grid; place-items:center; font-size:1.6rem; }
  .slot.on { border-style:solid; background:var(--gold); }
  .btn { background:var(--gold); color:var(--bg); border:0; border-radius:999px; padding:12px 24px; font-size:1.05rem; font-weight:700; cursor:pointer; font-family:var(--font); margin:6px; }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.ghost { background:transparent; color:var(--cream); border:2px solid var(--cream); }
  .menu .btn { display:block; width:100%; margin:10px 0; text-align:left; border-radius:14px; }
  .btn:focus-visible { outline:3px solid var(--cream); }
  canvas { width:100%; max-width:320px; border:2px solid var(--gold); border-radius:14px; background:var(--bg); touch-action:none; display:block; margin:10px auto; }
  #arena { position:relative; width:100%; max-width:320px; height:300px; margin:10px auto; border:2px solid var(--gold); border-radius:14px; overflow:hidden; }
  .runaway { position:absolute; left:110px; top:130px; padding:14px 20px; border:0; border-radius:12px; background:var(--coral); color:#fff; font-size:1.1rem; font-weight:800; cursor:pointer; font-family:var(--font); transition:left .12s, top .12s; }
  .warn { color:var(--coral); font-weight:800; min-height:1.5em; }
  .shake { animation:shake .3s; }
  .big { font-size:3.5rem; font-weight:800; color:var(--gold); margin:14px 0; animation:pop .6s ease-out; }
  .ltr { display:inline-block; font-size:3rem; font-weight:800; color:var(--gold); letter-spacing:.04em; animation:pop .5s ease-out; min-width:.5em; }
  #word { min-height:70px; margin:14px 0; }
  #bx { min-height:11rem; display:grid; place-items:center; }
  .box { background:none; border:0; cursor:pointer; line-height:1.1; animation:wiggle 1s ease-in-out infinite; }
  .box:focus-visible { outline:3px solid var(--cream); border-radius:16px; }
  .box.opening { animation:openup .7s ease-in forwards; }
  .conf { position:fixed; top:-20px; width:10px; height:14px; animation:fall var(--d) linear forwards; z-index:9; }
  .box.hit { animation:hit .3s; }
  .ltr.spin { color:var(--cream); opacity:.8; }
  .ltr.lock { animation:pop .35s ease-out; }
  .glow { animation:glow 1.1s ease-in-out infinite alternate; }
  .emo { position:fixed; top:-40px; font-size:1.8rem; animation:fall var(--d) linear forwards; z-index:9; }
  body.boom { animation:boom .25s; }
  @keyframes hit { 25% { transform:rotate(-14deg) scale(1.12); } 75% { transform:rotate(14deg) scale(1.12); } }
  @keyframes glow { from { text-shadow:0 0 6px var(--gold); } to { text-shadow:0 0 26px var(--gold), 0 0 48px var(--coral); } }
  @keyframes boom { 25% { transform:translate(-5px,3px); } 75% { transform:translate(5px,-3px); } }
  @keyframes wiggle { 0%,100% { transform:rotate(-6deg); } 50% { transform:rotate(6deg); } }
  @keyframes openup { 0% { transform:scale(1); } 30% { transform:scale(1.15) rotate(-8deg); } 100% { transform:scale(1.7); opacity:0; } }
  @keyframes shake { 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }
  @keyframes pop { from { transform:scale(.2); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion:reduce) { .big, .ltr, .box, .shake, .glow, body.boom, .box.hit { animation:none; } .conf, .emo { display:none; } .runaway { transition:none; } }
</style>
</head>
<body>
<main>
  <h1>Win the secret prize</h1>
  <div id="slots"></div>
  <div id="stage"></div>
</main>

<script>
  // ✏️ EDIT HERE: the secret prize word (hidden until the very end).
  const PRIZE = "BAHU MO";

  const $ = id => document.getElementById(id);
  const stage = $("stage");
  const won = [false, false, false];
  let timer = null, raf = null, running = false, keyH = null;

  const NAMES = ["Gem catcher", "Catch the button", "Cactus runner"];
  const INFO = ["Catch 10 gems. Dodge the bombs.", "Tap the button 7 times. Easy.", "Jump over 10 cactuses."];
  const TAUNTS = ["Skill issue 💀", "So close! (not really)", "My grandma plays better 👵",
    "Have you tried not losing?", "Lag. Definitely lag. 🫠", "Try again, champ 🤡", "Bro 😭"];
  const pick = a => a[Math.floor(Math.random() * a.length)];

  function stop() {
    clearInterval(timer); running = false; cancelAnimationFrame(raf);
    if (keyH) { document.removeEventListener("keydown", keyH); keyH = null; }
  }
  function loop(update) {
    running = true;
    const f = () => { update(); if (running) raf = requestAnimationFrame(f); };
    f();
  }
  function slots() {
    $("slots").innerHTML = won.map(w => `<div class="slot ${w ? "on" : ""}">${w ? "🔓" : "🔒"}</div>`).join("");
  }

  function menu() {
    stop(); slots();
    if (won.every(Boolean)) return reveal();
    stage.innerHTML = `<p>Win all 3 games to open the locks. The prize is a surprise!</p><div class="menu">` +
      NAMES.map((n, i) => `<button class="btn" data-i="${i}" ${won[i] ? "disabled" : ""}>
        ${won[i] ? "✅" : "🎮"} ${n}<br><small>${INFO[i]}</small></button>`).join("") + `</div>`;
    stage.querySelectorAll("[data-i]").forEach(b => b.onclick = () => [gems, chase, runner][b.dataset.i]());
  }

  function win(i) {
    stop(); won[i] = true; slots();
    const left = won.filter(w => !w).length;
    stage.innerHTML = `<h2>Level cleared! 🎉</h2><p>${left ? `A lock just opened. ${left} to go… (or did I let you win? 😏)` : "All locks are open!"}</p>
      <button class="btn" id="next">${left ? "Next game" : "Open the boxes"}</button>`;
    $("next").onclick = menu;
  }
  function lose(why, retry) {
    stop();
    stage.innerHTML = `<h2>Not this time 😅</h2><p>${why}</p><p><b>${pick(TAUNTS)}</b></p>
      <button class="btn" id="retry">Try again</button><button class="btn ghost" id="back">Back</button>`;
    $("retry").onclick = retry; $("back").onclick = menu;
  }

  /* Game 1: gem catcher (controls flip halfway!) */
  function gems() {
    stage.innerHTML = `<h2>Gem catcher</h2><p>Drag to move the basket.</p><p class="warn" id="w"></p><canvas id="cv" width="320" height="400"></canvas><button class="btn ghost" id="back">Back</button>`;
    $("back").onclick = menu;
    const cv = $("cv"), c = cv.getContext("2d");
    let px = 160, items = [], score = 0, lives = 3, t = 0, flipUntil = 0, flipped = false;
    cv.onpointermove = cv.onpointerdown = e => { const r = cv.getBoundingClientRect(); px = (e.clientX - r.left) * 320 / r.width; };
    loop(() => {
      t++;
      if (score >= 5 && !flipped) { flipped = true; flipUntil = t + 300; $("w").textContent = "🙃 CONTROLS FLIPPED 🙃"; }
      const inv = t < flipUntil;
      if (flipped && !inv) $("w").textContent = "";
      const bx = inv ? 320 - px : px;
      if (t % 30 === 0) items.push({ x: 20 + Math.random() * 280, y: -20, bomb: Math.random() < .32, v: 2.8 + Math.random() * 2.8 });
      c.clearRect(0, 0, 320, 400);
      c.font = "30px serif"; c.textAlign = "center";
      c.fillText("🧺", bx, 392);
      items.forEach(it => { it.y += it.v; c.fillText(it.bomb ? "💣" : "💎", it.x, it.y); });
      items = items.filter(it => {
        if (it.y > 355 && it.y < 400 && Math.abs(it.x - bx) < 34) { it.bomb ? lives-- : score++; return false; }
        return it.y < 430;
      });
      c.font = "16px sans-serif"; c.fillStyle = "#fdf0d5"; c.textAlign = "left";
      c.fillText(`💎 ${score}/10   ❤️ ${lives}`, 10, 22);
      if (score >= 10) win(0); else if (lives <= 0) lose("You hit too many bombs.", gems);
    });
  }

  /* Game 2: catch the runaway button (the trick: tap the empty space!) */
  function chase() {
    const NEED = 7, START = Date.now(), END = START + 30000;
    stage.innerHTML = `<h2>Catch the button</h2><p id="hud"></p><p class="warn" id="w"></p>
      <div id="arena"><button class="runaway" id="rb">Tap me</button></div>
      <button class="btn ghost" id="back">Back</button>`;
    $("back").onclick = menu;
    const rb = $("rb"), arena = $("arena"), hud = $("hud"), w = $("w");
    const mocks = ["Nope 😏", "Too slow!", "Lol you can't catch me", "Wrong move 😂", "It's a decoy 🤡", "Almost! (never)"];
    const oks = ["Wait… that counted?! 👀", "Ugh, fine.", "Stop that 😠", "How did you know?!", "Nooo 😭", "One more… 😱"];
    let n = 0, msg = "";
    const left = () => Math.max(0, Math.ceil((END - Date.now()) / 1000));
    const draw = () => hud.textContent = `${n}/${NEED} · ${left()}s ${msg}`;
    const jump = () => {
      rb.style.left = Math.random() * (arena.clientWidth - rb.offsetWidth) + "px";
      rb.style.top = Math.random() * (arena.clientHeight - rb.offsetHeight) + "px";
    };
    const shake = () => { w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake"); };
    // The button can never be caught: it dodges the pointer and the tap.
    rb.onpointerenter = jump;
    rb.onpointerdown = e => { e.stopPropagation(); msg = pick(mocks); jump(); draw(); };
    rb.onclick = e => { e.stopPropagation(); msg = pick(mocks); jump(); draw(); };
    // The trick: tapping the empty space counts.
    arena.onpointerdown = e => {
      if (e.target === rb) return;
      n++; msg = pick(oks);
      rb.style.transform = `scale(${1 - n * 0.09})`;
      if (n >= NEED) return win(1);
      jump(); draw();
    };
    draw();
    timer = setInterval(() => {
      const t = Date.now() - START;
      if (Date.now() > END) return lose("The button won this round.", chase);
      if (t > 14000 && n === 0) w.textContent = "Hint: tap anywhere BUT the button 👀";
      else if (t > 8000 && n === 0) w.textContent = "Psst… maybe stop chasing it 🤫";
      if (t > 3000) jump();
      draw();
    }, 700);
  }

  /* Game 3: cactus runner (tricks: upside down, invisible cactuses, turbo, moving goal) */
  function runner() {
    stage.innerHTML = `<h2>Cactus runner</h2><p>Tap the screen (or press Space) to jump.</p><p class="warn" id="w"></p><canvas id="cv" width="320" height="300"></canvas><button class="btn ghost" id="back">Back</button>`;
    $("back").onclick = menu;
    const cv = $("cv"), c = cv.getContext("2d"), G = 240, W = $("w");
    let y = G, vy = 0, obs = [], score = 0, t = 0, next = 50, target = 10;
    let flipUntil = 0, ghostUntil = 0, turboUntil = 0, clearAt = 0;
    let flipped = false, ghosted = false, turbo = false;
    const say = (m, frames) => { W.textContent = m; clearAt = frames ? t + frames : 0; };
    const jump = () => { if (y >= G) vy = -12.5; };
    cv.onpointerdown = jump;
    keyH = e => { if (e.code === "Space") { e.preventDefault(); jump(); } };
    document.addEventListener("keydown", keyH);
    loop(() => {
      t++; vy += .65; y = Math.min(G, y + vy); if (y === G) vy = 0;
      // Trick 1: the screen flips upside down
      if (score >= 4 && !flipped) { flipped = true; flipUntil = t + 150; cv.style.transform = "rotate(180deg)"; say("🙃 UPSIDE DOWN", 150); }
      if (flipped && t === flipUntil) cv.style.transform = "";
      // Trick 2: the cactuses turn invisible
      if (score >= 6 && !ghosted) { ghosted = true; ghostUntil = t + 150; say("👻 INVISIBLE CACTUSES", 150); }
      // Trick 3: turbo speed
      if (score >= 8 && !turbo) { turbo = true; turboUntil = t + 180; say("🚀 TURBO MODE", 180); }
      // Trick 4: the goal moves
      if (score >= 9 && target === 10) { target = 13; say("lol it's 13 now 😈", 0); }
      if (clearAt && t >= clearAt) { W.textContent = ""; clearAt = 0; }
      const sp = (4.5 + score * 0.3) * (t < turboUntil ? 1.4 : 1);
      if (t >= next) { obs.push({ x: 340, p: false }); next = t + 50 + Math.random() * 45; }
      obs.forEach(o => { o.x -= sp; if (!o.p && o.x < 30) { o.p = true; score++; } });
      obs = obs.filter(o => o.x > -30);
      c.clearRect(0, 0, 320, 300);
      c.fillStyle = "#fcbf49"; c.fillRect(0, G + 4, 320, 3);
      c.font = "34px serif"; c.textAlign = "center";
      c.fillText("🏃", 55, y);
      c.globalAlpha = t < ghostUntil ? 0.1 : 1;
      obs.forEach(o => c.fillText("🌵", o.x, G));
      c.globalAlpha = 1;
      c.font = "16px sans-serif"; c.fillStyle = "#fdf0d5"; c.textAlign = "left";
      c.fillText(`🌵 ${score}/${target}`, 10, 22);
      if (obs.some(o => Math.abs(o.x - 55) < 22 && y > G - 28)) return lose(`You bumped into a cactus at ${score}.`, runner);
      if (score >= target) win(2);
    });
  }

  /* Surprise reveal: smash the boxes big to small, then a slot-machine prize */
  function reveal() {
    const boxes = [
      { size: 9,   taps: 5, e: "🧦", t: "A sock?! Lol. Keep going!" },
      { size: 6.5, taps: 3, e: "🥔", t: "A potato. Rude. Next!" },
      { size: 4,   taps: 1, e: "",   t: "" }
    ];
    let i = 0;
    stage.innerHTML = `<h2>All locks are open!</h2><p id="bm"></p><div id="bx"></div>`;
    const next = () => {
      if (i >= boxes.length) return countdown();
      const b = boxes[i]; let left = b.taps;
      $("bm").textContent = left > 1 ? `Tap the box ${left} times to open it!` : "Last one! Pinky promise. 🤞";
      $("bx").innerHTML = `<button class="box" style="font-size:${b.size}rem" aria-label="Open box">🎁</button>`;
      const el = $("bx").firstChild;
      el.onanimationend = () => el.classList.remove("hit");
      el.onclick = () => {
        left--;
        if (left > 0) {
          $("bm").textContent = left === 1 ? "One more!!" : `${left} more!`;
          el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit");
          return;
        }
        el.disabled = true; el.classList.add("opening");
        setTimeout(() => {
          if (!b.e) { i++; return next(); }
          $("bx").innerHTML = `<div style="font-size:5rem">${b.e}</div>`;
          $("bm").textContent = b.t;
          setTimeout(() => { i++; next(); }, 1500);
        }, 700);
      };
    };
    next();
  }
  function countdown() {
    let n = 3; stage.innerHTML = `<p id="cp">Get ready…</p><div class="big" id="cd">3</div>`;
    timer = setInterval(() => {
      n--;
      if (n > 0) $("cd").textContent = n;
      else {
        clearInterval(timer);
        $("cd").textContent = "😈"; $("cp").textContent = "Just kidding… wait for it…";
        setTimeout(show, 1400);
      }
    }, 900);
  }
  function show() {
    stage.innerHTML = `<p>Your prize word is…</p><div id="word"></div><button class="btn ghost" id="reset" hidden>Play again</button>`;
    const word = $("word"), abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    word.innerHTML = [...PRIZE].map(ch => `<span class="ltr spin">${ch === " " ? "&nbsp;" : "?"}</span>`).join("");
    const sp = [...word.children];
    let locked = 0, tick = 0;
    timer = setInterval(() => {
      tick++;
      sp.forEach((el, k) => { if (k >= locked && PRIZE[k] !== " ") el.textContent = abc[Math.floor(Math.random() * 26)]; });
      if (tick % 16 === 0) {
        while (PRIZE[locked] === " ") locked++;
        sp[locked].textContent = PRIZE[locked]; sp[locked].classList.remove("spin"); sp[locked].classList.add("lock");
        locked++;
        while (locked < PRIZE.length && PRIZE[locked] === " ") locked++;
        document.body.classList.remove("boom"); void document.body.offsetWidth; document.body.classList.add("boom");
        if (locked >= PRIZE.length) { clearInterval(timer); finale(); }
      }
    }, 60);
  }
  function finale() {
    $("word").classList.add("glow");
    confetti(); setTimeout(confetti, 900); setTimeout(confetti, 1800);
    rain();
    $("reset").hidden = false;
    $("reset").onclick = () => { won.fill(false); menu(); };
  }
  function confetti() {
    const cols = ["#fcbf49", "#ef476f", "#06d6a0", "#118ab2", "#fdf0d5"];
    for (let i = 0; i < 60; i++) {
      const s = document.createElement("span");
      s.className = "conf"; s.style.left = Math.random() * 100 + "vw";
      s.style.background = cols[i % cols.length];
      s.style.setProperty("--d", 2 + Math.random() * 2.5 + "s");
      document.body.appendChild(s); setTimeout(() => s.remove(), 4800);
    }
  }
  function rain() {
    const em = ["🎉", "🎊", "⭐", "🏆", "🥳", "💎", "🎁"];
    for (let i = 0; i < 30; i++) {
      const s = document.createElement("span");
      s.className = "emo"; s.textContent = pick(em); s.style.left = Math.random() * 95 + "vw";
      s.style.animationDelay = Math.random() * 2 + "s"; s.style.setProperty("--d", 3 + Math.random() * 3 + "s");
      document.body.appendChild(s); setTimeout(() => s.remove(), 8000);
    }
  }

  menu();
</script>
</body>
</html>
